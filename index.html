<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLU">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>PLU kereső</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header>
    <div id="heard" aria-live="polite">&nbsp;</div>
    <button id="menuBtn" type="button" aria-label="Menü" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <section id="result">
    <div id="plu">—</div>
    <div id="pname">Koppints a mikrofonra</div>
    <div id="alts"></div>
  </section>

  <section id="micZone">
    <button id="mic" type="button" aria-label="Beszéd indítása">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8.5 21.5h7"/>
      </svg>
    </button>
  </section>

  <footer>
    <input id="q" type="search" placeholder="Írd be a termék nevét vagy kódját" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Kereső">
  </footer>
</main>

<div id="menu" hidden>
  <div id="scrim"></div>
  <aside id="panel" role="dialog" aria-modal="true" aria-label="Menü">
    <div class="phead">
      <button id="back" type="button" aria-label="Vissza" hidden>‹</button>
      <h2 id="ptitle">Menü</h2>
      <button id="close" type="button" aria-label="Bezárás">✕</button>
    </div>

    <div id="v-main" class="view">
      <button class="big" data-go="settings" type="button">⚙️ Beállítások</button>
      <button class="big" data-go="list" type="button">📋 Terméklista</button>
    </div>

    <div id="v-settings" class="view" hidden>
      <label class="row"><span>Hangos felolvasás</span><input type="checkbox" id="optSound" role="switch"></label>
      <label class="row"><span>Számjegyenként olvassa<small>pl. „négy négy négy”</small></span><input type="checkbox" id="optDigits" role="switch"></label>
      <label class="row col"><span>Hang</span>
        <select id="optVoice"></select>
      </label>
      <button class="big" id="testVoice" type="button">▶︎ Hang kipróbálása</button>
      <p class="hint">Automatikusan a legjobb minőségű magyar hangot választja. iPhone-on jobb hang: Beállítások → Kisegítő lehetőségek → Felolvasott tartalom → Hangok → Magyar → töltsd le a „Továbbfejlesztett” vagy „Prémium” változatot.</p>
    </div>

    <div id="v-list" class="view" hidden>
      <input id="lf" type="search" placeholder="Szűrés a listában" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Szűrés a listában">
      <div id="plist"></div>
    </div>
  </aside>
</div>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
